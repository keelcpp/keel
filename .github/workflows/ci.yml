name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            no_exc: OFF
            sanitizers: ON
          - os: ubuntu-latest
            compiler: gcc-no-exceptions
            cc: gcc
            cxx: g++
            no_exc: ON
            sanitizers: OFF
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            no_exc: OFF
            sanitizers: ON
          - os: ubuntu-latest
            compiler: clang-no-exceptions
            cc: clang
            cxx: clang++
            no_exc: ON
            sanitizers: OFF
          - os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++
            no_exc: OFF
            sanitizers: ON
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            no_exc: OFF
            sanitizers: OFF
          - os: windows-latest
            compiler: msvc-no-exceptions
            cc: cl
            cxx: cl
            no_exc: ON
            sanitizers: OFF

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          SANITIZER_FLAGS=""
          if [ "${{ matrix.sanitizers }}" = "ON" ]; then
            SANITIZER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKEEL_NO_EXCEPTIONS_RTTI=${{ matrix.no_exc }} \
            -DCMAKE_CXX_FLAGS="${SANITIZER_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${SANITIZER_FLAGS}"
        shell: bash

      - name: Build
        run: cmake --build build --config Debug

      - name: Run Tests & Header Purity Check
        run: ctest --test-dir build -C Debug --output-on-failure
